name: Backtest

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which research script to run"
        type: choice
        options: [backtest, plan_lsb, house_5y, horizon, timing]
        default: backtest

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt tabulate
      - run: python research/${{ inputs.script || 'backtest' }}.py
      - name: Commit results
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          git diff --cached --quiet && exit 0
          git commit -m "Backtest results $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
