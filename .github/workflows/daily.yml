name: Daily paper trade

on:
  schedule:
    # Weekdays at 21:40 UTC: after the US close in both summer (20:00 UTC) and winter (21:00 UTC).
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh_fundamentals:
        description: "Re-download every company's statements now (otherwise weekly)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      EMAIL_FROM:          ${{ secrets.EMAIL_FROM }}
      EMAIL_TO:            ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the paper trader
        run: python run.py ${{ inputs.refresh_fundamentals && '--refresh-fundamentals' || '' }}

      - name: Commit results
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
